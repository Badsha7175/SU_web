<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Poppins', sans-serif;
        background-color: #f1f5f9;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 30px 15px;
    }

    form {
        background-color: #ffffff;
        width: 100%;
        max-width: 500px;
        padding: 35px;
        border-radius: 12px;
        box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
    }

    h1 {
        text-align: center;
        margin-bottom: 25px;
        color: #1e293b;
        font-size: 26px;
    }

    form div {
        margin-bottom: 18px;
    }

    label {
        display: inline-block;
        margin-bottom: 7px;
        color: #334155;
        font-size: 14px;
        font-weight: 500;
    }

    input[type="text"],
    input[type="email"],
    input[type="date"],
    input[type="tel"],
    input[type="password"],
    select {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        font-size: 14px;
        outline: none;
        transition: 0.3s;
    }

    input:focus,
    select:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    input[type="radio"] {
        accent-color: #2563eb;
        margin-right: 5px;
        cursor: pointer;
    }

    input[type="checkbox"] {
        accent-color: #2563eb;
        cursor: pointer;
    }

    input[type="radio"]+label,
    input[type="checkbox"]+label {
        margin-right: 15px;
        margin-bottom: 0;
        cursor: pointer;
    }

    button {
        width: 100%;
        padding: 13px;
        background-color: #2563eb;
        color: white;
        border: none;
        border-radius: 7px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background-color: #1d4ed8;
    }
</style>

<body>

    <h1>Student Registration Form</h1>

    <form action="#" method="post">

        <div>
            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="fname" placeholder="First Name" required>
        </div>

        <div>
            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname" placeholder="Last Name" required>
        </div>

        <div>
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Your Email" required>
        </div>

        <div>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>
        </div>

        <div>
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="Phone Number" required>
        </div>

        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter Password" required>
        </div>

        <div>
            <label>Gender:</label>

            <input type="radio" id="male" name="gender" value="male" required>
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
        </div>

        <div>
            <label for="district">District:</label>

            <select id="district" name="district" required>
                <option value="">Select District</option>
                <option value="Nilphamari">Nilphamari</option>
                <option value="Rangpur">Rangpur</option>
                <option value="Dhaka">Dhaka</option>
                <option value="Rajshahi">Rajshahi</option>
                <option value="Barishal">Barishal</option>
                <option value="Dinajpur">Dinajpur</option>
            </select>
        </div>

        <div>
            <input type="checkbox" id="terms" name="terms" value="accepted" required>
            <label for="terms">
                I agree with Terms and Conditions
            </label>
        </div>

        <div>
            <button type="submit">Submit</button>
        </div>

    </form>

</body>

</html>
